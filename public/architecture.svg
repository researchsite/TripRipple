  <rect x="80" y="430" width="140" height="22" rx="5" fill="#150c2e" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="150" y="444" text-anchor="middle" fill="#a78bfa" font-size="10">query ✦ NEW</text>
  <rect x="230" y="430" width="140" height="22" rx="5" fill="#150c2e" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="300" y="444" text-anchor="middle" fill="#a78bfa" font-size="10">evaluate ✦ NEW</text>
  <rect x="380" y="430" width="140" height="22" rx="5" fill="#150c2e" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="450" y="444" text-anchor="middle" fill="#a78bfa" font-size="10">inject ✦ NEW</text>

  <line x1="320" y1="455" x2="320" y2="465" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="80" y="465" width="460" height="95" rx="8" fill="#080f1e" stroke="#1e293b" stroke-width="1"/>
  <text x="310" y="482" text-anchor="middle" fill="#475569" font-size="10" font-weight="600">What each route does</text>
  <text x="95" y="498" fill="#64748b" font-size="9">cancel → seeds ES, starts Mastra workflow async (suspends at resolve-evidence)</text>
  <text x="95" y="512" fill="#64748b" font-size="9">search → calls Amadeus (cached), runs deterministic evaluator on all candidates</text>
  <text x="95" y="526" fill="#64748b" font-size="9">confirm → updates evidence flag, resumes Mastra at resolve-evidence step</text>
  <text x="95" y="540" fill="#64748b" font-size="9">approve → updates ES decision states, resumes Mastra at organizer-approval</text>
  <text x="95" y="554" fill="#64748b" font-size="9">query/inject → call Claude Haiku for AI answer or event classification</text>

