  <text x="130" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">drafts</text>
  <rect x="190" y="398" width="100" height="22" rx="5" fill="#0c2333" stroke="#1e4976" stroke-width="1"/>
  <text x="240" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">state</text>
  <rect x="300" y="398" width="100" height="22" rx="5" fill="#0c2333" stroke="#1e4976" stroke-width="1"/>
  <text x="350" y="412" text-anchor="middle" fill="#94a3b8" font-size="10">reset</text>
