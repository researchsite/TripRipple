  <text x="990" y="403" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">Workflow Steps</text>
  <text x="905" y="420" fill="#64748b" font-size="9">1. load-trip-memory</text>
  <text x="905" y="436" fill="#64748b" font-size="9">2. search-and-evaluate</text>
  <text x="905" y="452" fill="#14b8a6" font-size="9">3. resolve-evidence ⏸ SUSPEND</text>
  <text x="905" y="468" fill="#14b8a6" font-size="9">4. organizer-approval ⏸ SUSPEND</text>
  <text x="905" y="484" fill="#64748b" font-size="9">5. activate-decision</text>
  <text x="905" y="500" fill="#64748b" font-size="9">6. retrieve-ripple</text>
  <text x="905" y="516" fill="#64748b" font-size="9">7. draft-updates</text>
  <text x="990" y="548" text-anchor="middle" fill="#0d9488" font-size="8">Runs async from /cancel · resumed by /confirm &amp; /approve</text>

