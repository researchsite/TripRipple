  <text x="1125" y="492" fill="#64748b" font-size="9">retrieveRippleTool</text>
  <text x="1125" y="508" fill="#64748b" font-size="9">  → fixtures.ts: RIPPLES</text>
  <text x="1125" y="528" fill="#64748b" font-size="9">generateDraftsTool</text>
  <text x="1125" y="544" fill="#64748b" font-size="9">  → fixtures.ts: DRAFTS</text>

