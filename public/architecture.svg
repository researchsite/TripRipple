  <text x="570" y="703" text-anchor="middle" fill="#475569" font-size="9">claude-haiku-4-5-20251001</text>
  <rect x="440" y="712" width="260" height="85" rx="6" fill="#0a0614"/>
  <text x="570" y="727" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">Used for</text>
  <text x="455" y="742" fill="#64748b" font-size="9">Ask Memory: question → synthesized answer</text>
  <text x="455" y="756" fill="#64748b" font-size="9">Inject Event: message → type + subject + affects</text>
