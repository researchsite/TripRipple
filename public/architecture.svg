  <rect x="1000" y="150" width="140" height="50" rx="8" fill="#150c2e" stroke="#4c1d95" stroke-width="1"/>
  <text x="1070" y="170" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">Anthropic</text>
