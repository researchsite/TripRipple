  <text x="130" y="382" text-anchor="middle" fill="#94a3b8" font-size="10">cancel</text>
  <rect x="190" y="368" width="100" height="22" rx="5" fill="#0c2333" stroke="#1e4976" stroke-width="1"/>
  <text x="240" y="382" text-anchor="middle" fill="#94a3b8" font-size="10">search</text>
  <rect x="300" y="368" width="100" height="22" rx="5" fill="#0c2333" stroke="#1e4976" stroke-width="1"/>
  <text x="350" y="382" text-anchor="middle" fill="#94a3b8" font-size="10">confirm</text>
