  <text x="725" y="358" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">store.ts</text>
  <text x="725" y="374" text-anchor="middle" fill="#475569" font-size="9">Server-side singleton</text>
  <rect x="635" y="383" width="180" height="18" rx="4" fill="#0a1825"/>
